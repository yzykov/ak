name: Akomfort product catalog sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/modify products (otherwise audit only)'
        type: boolean
        default: false
      activate_new:
        description: 'Publish newly created cards after images are uploaded'
        type: boolean
        default: false
      allow_deactivate:
        description: 'Deactivate absent goods (subject to safety checks)'
        type: boolean
        default: false
  schedule:
    - cron: '30 9 * * 1'

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      AKOMFORT_IMPORT_TOKEN: ${{ secrets.AKOMFORT_IMPORT_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_ADMIN_USER_ID: ${{ secrets.TG_ADMIN_USER_ID }}
      SCHEDULE_APPLY: ${{ vars.CATALOG_SYNC_APPLY }}
      SCHEDULE_ACTIVATE: ${{ vars.CATALOG_SYNC_ACTIVATE_NEW }}
      SCHEDULE_DEACTIVATE: ${{ vars.CATALOG_SYNC_DEACTIVATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build plan / sync
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(python catalog_sync.py --config config/catalog.json --out output)
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            if [[ '${{ inputs.apply }}' == 'true' ]]; then ARGS+=(--apply --category-wait-seconds 900); fi
            if [[ '${{ inputs.activate_new }}' == 'true' ]]; then ARGS+=(--activate-new); fi
            if [[ '${{ inputs.allow_deactivate }}' == 'true' ]]; then ARGS+=(--allow-deactivate); fi
          else
            if [[ "$SCHEDULE_APPLY" == 'true' ]]; then ARGS+=(--apply --category-wait-seconds 900); fi
            if [[ "$SCHEDULE_ACTIVATE" == 'true' ]]; then ARGS+=(--activate-new); fi
            if [[ "$SCHEDULE_DEACTIVATE" == 'true' ]]; then ARGS+=(--allow-deactivate); fi
          fi
          "${ARGS[@]}"
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sync-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30